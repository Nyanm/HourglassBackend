[package]
name = "web_receiver"
version.workspace = true
edition.workspace = true

[[bin]]
name = "web_receiver"
path = "src/web_receiver_main.rs"

[dependencies]
hg_common  = { workspace = true }

anyhow     = { workspace = true }
